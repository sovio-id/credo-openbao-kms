version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    # @credo-ts/drizzle-storage still peers on drizzle-orm ^0.44.6, so a 0.45
    # bump cannot be installed without ignoring peer dependencies.
    ignore:
      - dependency-name: 'drizzle-orm'
        versions:
          - '>=0.45.0'
    groups:
      credo:
        patterns:
          - '@credo-ts/*'
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Etc/UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(deps)'
