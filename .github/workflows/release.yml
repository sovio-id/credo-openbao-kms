name: Version Packages

# Opens or updates the "Version Packages" pull request from the changesets
# merged into main. Merging that pull request bumps package.json, jsr.json and
# CHANGELOG.md. Nothing is published or tagged here: publishing still happens
# when a maintainer publishes a GitHub release, which starts the existing
# "Publish to npm" and "Publish to JSR" workflows.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version Packages pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Create or update the Version Packages pull request
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          version: npm run version-packages
          title: 'chore: version packages'
          commit: |-
            chore: version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
