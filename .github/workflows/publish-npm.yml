name: Publish to npm

# Runs only when a GitHub release is published. Requires the NPM_TOKEN
# repository secret (a granular npm token with publish rights on the
# @sovio-id scope), which a maintainer adds by hand.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # prepublishOnly runs `bun run build`.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
